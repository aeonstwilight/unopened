# Test-only capa rule. Matches the synthetic fixture's import table; never used in production.
rule:
  meta:
    name: write and start code in another process (fixture rule)
    namespace: host-interaction/process/inject
    authors:
      - unopened tests
    scopes:
      static: file
      dynamic: file
    att&ck:
      - Defense Evasion::Process Injection [T1055]
    mbc:
      - Defense Evasion::Process Injection [E1055]
  features:
    - and:
      - import: kernel32.VirtualAllocEx
      - import: kernel32.WriteProcessMemory
      - import: kernel32.CreateRemoteThread
