# Brands phishing emails impersonate most often, with the domains each one really sends
# mail and hosts sign-in pages from. Edit freely.
#
# The email analyzer flags a sender, reply-to or link domain that contains a brand name
# (after undoing common look-alike swaps such as 0 -> o, 1 -> l, rn -> m, vv -> w) but
# is not one of that brand's domains or a subdomain of one. The name must start a label
# or follow a hyphen, dot or digit ("secure-paypal", "microsoftonline-login"), so words
# that merely contain it ("pineapple") do not match. Keep names at five or more
# characters: short ones (ups, dhl, zoom) match too much.

[microsoft]
domains = ["microsoft.com", "office.com", "office365.com", "outlook.com", "live.com",
           "microsoftonline.com", "sharepoint.com", "onmicrosoft.com", "hotmail.com",
           "msn.com", "azure.com", "windows.net", "microsoft365.com", "cloud.microsoft"]

[office365]
domains = ["office365.com", "office.com", "microsoft.com", "microsoftonline.com"]

[outlook]
domains = ["outlook.com", "office.com", "microsoft.com", "live.com"]

