version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # capa, FLOSS and yara-python publish wheels for a new Python some months after
      # its release; move the base image by hand once CI passes on it.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
