name: Container image

# Publishes ghcr.io/<owner>/unopened when a release is published (tagged with the
# version and "latest"), or on demand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unopened"
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Log in to the GitHub container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          docker build \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/-t /') .
      - name: Smoke test offline before publishing
        run: |
          python3 -c "import sys; sys.path.insert(0, 'tests'); from fixtures import mail; open('phish.eml', 'wb').write(mail.phish_eml())"
          mkdir -m 777 out
          docker run --rm --network none -v "$PWD:/work" "${{ steps.meta.outputs.image }}:latest" \
            triage /work/phish.eml --out /work/out
          grep -q "MALICIOUS" out/*.md
      - name: Push
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do docker push "$tag"; done
