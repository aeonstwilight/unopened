name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install with every optional analyzer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
          # oscrypto 1.3.0 on PyPI cannot parse OpenSSL 3.0.10+ version strings, so signify
          # (Authenticode) fails to load without the upstream fix. Both report version 1.3.0,
          # so the fix must be force-reinstalled over the PyPI copy. See README, Install.
          pip install --force-reinstall --no-deps "oscrypto @ git+https://github.com/wbond/oscrypto.git@1547f535001ba568b239b8797465536759c742a3"
          python -c "import signify.authenticode"  # fail here, clearly, if it still cannot load
      - name: Lint
        run: ruff check src tests
      - name: Verdict rules documentation is current
        run: |
          python -m unopened.verdict > /tmp/verdict-rules.md
          diff -u docs/verdict-rules.md /tmp/verdict-rules.md
      - name: Tests (synthetic fixtures only; sockets and subprocesses are blocked)
        run: pytest -q
